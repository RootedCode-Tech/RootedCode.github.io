<!DOCTYPE html>
<html lang="fi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yggdrasil</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

:root{

    --primary:#86c34a;
    --primary-hover:#6fa337;

    --card:rgba(22,33,24,.72);

    --text:#ffffff;

    --shadow:rgba(0,0,0,.35);

    --glass:rgba(255,255,255,.15);

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    font-family:"Segoe UI",sans-serif;

    background:
        linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
        url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:25px;

    animation:bgZoom 18s ease-in-out infinite alternate;

}

main{

    width:100%;
    max-width:420px;

}

.container{

    background:var(--card);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid var(--glass);

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:0 20px 45px var(--shadow);

    animation:fadeUp .9s ease;

}

.profile-pic{

    width:130px;
    height:130px;

    object-fit:cover;

    border-radius:50%;

    border:3px solid white;

    margin-bottom:20px;

    transition:.4s;

    box-shadow:
        0 0 25px rgba(255,255,255,.35),
        0 15px 30px rgba(0,0,0,.35);

    animation:profileAppear 1s ease;

}

.profile-pic:hover{

    transform:scale(1.08) rotate(5deg);

}

h1{

    color:white;

    font-size:2rem;

    margin-bottom:8px;

    letter-spacing:1px;

}

.subtitle{

    color:#d6d6d6;

    font-size:.95rem;

    margin-bottom:28px;

    line-height:1.5;

}

nav{

    display:flex;

    flex-direction:column;

    gap:16px;

}

.link-button{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    position:relative;

    overflow:hidden;

    text-decoration:none;

    color:#111;

    background:var(--primary);

    padding:16px;

    border-radius:50px;

    font-weight:600;

    opacity:0;

    transform:translateY(30px);

    animation:buttonFade .7s forwards;

    transition:
        transform .35s cubic-bezier(.34,1.56,.64,1),
        background .3s,
        box-shadow .3s,
        color .3s;

}

.link-button:nth-child(1){

    animation-delay:.4s;

}

.link-button:nth-child(2){

    animation-delay:.6s;

}

.link-button:nth-child(3){

    animation-delay:.8s;

}

.link-button:nth-child(4){

    animation-delay:1s;

}

.link-button::before{

    content:"";

    position:absolute;

    left:-120%;

    top:0;

    width:70%;

    height:100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    transition:.8s;

}

.link-button:hover{

    background:var(--primary-hover);

    color:white;

    transform:translateY(-4px) scale(1.03);

    box-shadow:0 14px 28px rgba(0,0,0,.35);

}

.link-button:hover::before{

    left:140%;

}

.link-button i{

    font-size:1.2rem;

}

footer{

    margin-top:28px;

    color:#bfbfbf;

    font-size:.8rem;

}

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(-40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes profileAppear{

from{

opacity:0;

transform:scale(.3) rotate(-180deg);

}

to{

opacity:1;

transform:scale(1);

}

}

@keyframes buttonFade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

@keyframes bgZoom{

from{

background-size:100%;

}

to{

background-size:108%;

}

}

@media(max-width:480px){

.container{

padding:25px;

}

.profile-pic{

width:105px;
height:105px;

}

h1{

font-size:1.7rem;

}

.subtitle{

font-size:.9rem;

}

}

</style>

</head>

<body>

<main>

<section class="container">

<header>

<img src="Profiilikuva.png"
class="profile-pic"
alt="Profile picture">

<h1>Yggdrasil</h1>

<p class="subtitle">
IT Specialist • Linux • Networking • PowerShell • CCNA Student
</p>

</header>

<nav>

<a class="link-button"
href="https://github.com/RootedCode-Tech"
target="_blank"
rel="noopener noreferrer">

<i class="fa-brands fa-github"></i>

GitHub

</a>

<a class="link-button"
href="https://linkedin.com/in/jari-mikkonen98"
target="_blank"
rel="noopener noreferrer">

<i class="fa-brands fa-linkedin"></i>

LinkedIn

</a>

<a class="link-button"
href="https://youtube.com/@korrinbarthehunter"
target="_blank"
rel="noopener noreferrer">

<i class="fa-brands fa-youtube"></i>

YouTube

</a>

<a class="link-button"
href="https://twitch.tv/korrinbarthehunter"
target="_blank"
rel="noopener noreferrer">

<i class="fa-brands fa-twitch"></i>

Twitch

</a>

</nav>

<footer>

© 2026 Yggdrasil

</footer>

</section>

</main>

</body>

</html>
